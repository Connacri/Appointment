name: Native Windows Runtime CI

on:
  push:
    branches:
      - feat/hotel-onboarding-tauri-runtime
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/services/desktopRuntime.ts"
      - "src/components/EstablishmentSetupModal.tsx"
      - "src/components/IndexedDbInspectorModal.tsx"
      - "src/locks/database/mdbImport.ts"
      - "src/locks/lockManager.ts"
      - "src/db/indexedDb.ts"
      - "src/components/TopBar.tsx"
      - "src/components/HelpCenterView.tsx"
      - "src/utils/hotelStructure.ts"
      - "tests/hotelStructure.test.ts"
      - "docs/**"
      - "README*"
      - "scripts/package-windows.ps1"
      - "package.json"
      - ".github/workflows/native-windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-native-windows:
    name: Build and test Tauri Windows runtime
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      - name: TypeScript checks
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build native Windows installer
        env:
          VITE_BASE: ./
        run: npm run tauri:build
