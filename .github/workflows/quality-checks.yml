name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Data Contract — Toujours
  data-contract:
    name: Data contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/npm-install
        with:
          cache-npm: true
          cache-dir: .npm
      - run: npm run data-contract:check

  # 2. Typecheck — Avec cache npm
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/npm-install
        with:
          cache-npm: true
          cache-dir: .npm
      - run: npm run typecheck

  # 3. Tests sélectifs — Matrix OR optimisée
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        test-file: ["bookingFinder", "bookingValidation"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/npm-install
        with:
          cache-npm: true
          cache-dir: .npm
      - run: npm test -- --testPathPattern="tests/${{ matrix.test-file }}.test.ts"

  # 4. i18n check — Rapide
  i18n-check:
    name: i18n parity (fr / en / ar)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/npm-install
        with:
          cache-npm: true
          cache-dir: .npm
      - run: npm run i18n:check

  # 5. Production build — Cache Vite intelligent
  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/npm-install
        with:
          cache-npm: true
          cache-dir: .npm
          # Cache Vite hashé au package.json
          - key: vite-${{ hashPackageJson 'package.json' }}-${{ runner.os }}
            restore-keys: |
              vite-${{ hashPackageJson 'package.json' }}-${{ runner.os }}
      - run: npm run build

  # 6. Résumé CI — Rapport final
  ci-summary:
    name: CI required checks summary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [data-contract, typecheck, regression-tests, i18n-check, production-build]
    if: always()
    steps:
      - name: Report check results
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.regression-tests.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          DATA_CONTRACT_RESULT: ${{ needs.data-contract.result }}
        run: |
          echo "## CI quality checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript typecheck | $TYPECHECK_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression tests | $TEST_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Production build | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Data contract | $DATA_CONTRACT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$TYPECHECK_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$DATA_CONTRACT_RESULT" != "success" ]]; then
            echo "::error::At least one required quality check did not succeed." >> $GITHUB_STEP_SUMMARY
          else
            echo "All required quality checks succeeded." >> $GITHUB_STEP_SUMMARY