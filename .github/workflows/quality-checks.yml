name: Quality Checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, regression tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Regression tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          VITE_BASE: ./
