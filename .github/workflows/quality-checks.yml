name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data-contract:
    name: Data contract change-set validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history for PR/push diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate data-contract change set
        run: npm run data-contract:check

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Run TypeScript typecheck
        run: npm run typecheck

  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Run regression tests
        run: npm run test

      - name: i18n parity (fr / en / ar)
        run: npm run i18n:check

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Build production application
        run: npm run build
        env:
          VITE_BASE: ./

  ci-summary:
    name: CI required checks summary
    runs-on: ubuntu-latest
    needs:
      - data-contract
      - typecheck
      - regression-tests
      - production-build
    if: ${{ always() }}
    steps:
      - name: Report check results
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.regression-tests.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          DATA_CONTRACT_RESULT: ${{ needs.data-contract.result }}
        run: |
          {
            echo "## CI quality checks"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| TypeScript typecheck | $TYPECHECK_RESULT |"
            echo "| Regression tests | $TEST_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Data contract | $DATA_CONTRACT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TYPECHECK_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$DATA_CONTRACT_RESULT" != "success" ]]; then
            echo "::error::At least one required quality check did not succeed."
            exit 1
          fi
          echo "All required quality checks succeeded."
