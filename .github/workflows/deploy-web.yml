name: Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy production website
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Build Web Application (Vite Production SPA)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Ensure GitHub Pages SPA 404.html and .nojekyll
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify Legal Pages in dist output
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          for p in privacy delete-account; do
            for l in "" fr/ en/ ar/; do
              test -f "dist/$p/${l}index.html" || fail "Missing dist/$p/${l}index.html in production build"
            done
            grep -q 'dir="rtl"' "dist/$p/ar/index.html" || fail "dist/$p/ar/index.html must declare dir=\"rtl\""
            grep -qi '<title>' "dist/$p/index.html" || fail "dist/$p/index.html must declare a <title>"
          done

          if grep -rEn 'TODO|REPLACE_ME|CHANGE_ME|your-email|example\.(com|org)|\{\{|AgentOps' dist/privacy dist/delete-account; then
            fail "Placeholder or stale branding text found in legal pages"
          fi

          grep -qi 'privacy' README.md || fail "README.md must link the Privacy Policy"
          grep -qi 'delete-account' README.md || fail "README.md must link the Delete Account page"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Remove stale github-pages artifacts on rerun
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.artifacts || []) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000

      - name: Verify deployed website matches this build
        run: |
          set -euo pipefail
          EXPECTED="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -n 1)"
          test -n "$EXPECTED" || { echo "::error::No entry asset found in dist/index.html"; exit 1; }
          BASE="https://connacri.github.io/Appointment"
          LIVE=""
          for attempt in $(seq 1 20); do
            LIVE="$(curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${BASE}/index.html?cachebust=$(date +%s%N)" \
              | grep -o 'assets/index-[^"]*\.js' | head -n 1 || true)"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Live entry asset matches this build: $LIVE"
              break
            fi
            echo "Attempt ${attempt}/20: live=${LIVE:-<none>} expected=${EXPECTED}"
            if [ "$attempt" -eq 20 ]; then
              echo "::error::GitHub Pages still serves a stale build (expected ${EXPECTED}, got ${LIVE:-<none>})"
              exit 1
            fi
            sleep 30
          done

          for path in "" privacy/ privacy/fr/ privacy/en/ privacy/ar/ delete-account/ delete-account/fr/ delete-account/en/ delete-account/ar/; do
            url="${BASE}/${path}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$url did not return HTTP 200"; exit 1; }
          done
