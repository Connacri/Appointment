name: Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy production website
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Build Web Application (Vite Production SPA)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Verify GitHub Pages base-path assets
        run: |
          set -euo pipefail
          for asset in favicon.svg apple-touch-icon.png; do
            test -s "dist/$asset" || { echo "::error::Missing dist/$asset"; exit 1; }
            grep -Fq "href=\"./$asset\"" dist/index.html || {
              echo "::error::dist/index.html must reference ./$asset for the repository Pages base path"; exit 1;
            }
          done

      - name: Ensure GitHub Pages SPA 404.html and .nojekyll
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify Legal Pages in dist output
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          for p in privacy delete-account; do
            for l in "" fr/ en/ ar/; do
              test -f "dist/$p/${l}index.html" || fail "Missing dist/$p/${l}index.html in production build"
            done
            grep -q 'dir="rtl"' "dist/$p/ar/index.html" || fail "dist/$p/ar/index.html must declare dir=\"rtl\""
            grep -qi '<title>' "dist/$p/index.html" || fail "dist/$p/index.html must declare a <title>"
          done

          if grep -rEn 'TODO|REPLACE_ME|CHANGE_ME|your-email|example\.(com|org)|\{\{|AgentOps' dist/privacy dist/delete-account; then
            fail "Placeholder or stale branding text found in legal pages"
          fi

          grep -qi 'privacy' README.md || fail "README.md must link the Privacy Policy"
          grep -qi 'delete-account' README.md || fail "README.md must link the Delete Account page"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Remove stale github-pages artifacts on rerun
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.artifacts || []) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Pages Artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Verify Pages artifact metadata is visible
        uses: actions/github-script@v7
        env:
          EXPECTED_ARTIFACT_ID: ${{ steps.upload-pages.outputs.artifact_id }}
        with:
          script: |
            const expectedId = Number(process.env.EXPECTED_ARTIFACT_ID);
            if (!Number.isSafeInteger(expectedId) || expectedId <= 0) {
              throw new Error("upload-pages-artifact did not return a valid artifact_id.");
            }

            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const artifact = (data.artifacts || []).find(
                (item) => item.id === expectedId &&
                  item.name === "github-pages" &&
                  item.expired === false
              );

              if (artifact) {
                core.info(`Pages artifact ${artifact.name} (#${artifact.id}) is visible (${artifact.size_in_bytes} bytes).`);
                return;
              }

              core.warning(`Pages artifact #${expectedId} not visible yet (attempt ${attempt}/8).`);
              if (attempt < 8) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            throw new Error(
              `GitHub Actions artifact API did not expose github-pages artifact #${expectedId} after 8 checks.`
            );

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: Verify deployed website matches this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          EXPECTED="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -n 1)"
          test -n "$EXPECTED" || { echo "::error::No entry asset found in dist/index.html"; exit 1; }
          BASE="${PAGE_URL%/}"
          test -n "$BASE" || { echo "::error::GitHub Pages did not return a deployment URL"; exit 1; }
          LIVE=""
          for attempt in $(seq 1 20); do
            LIVE="$(curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${BASE}/index.html?cachebust=$(date +%s%N)" \
              | grep -o 'assets/index-[^"]*\.js' | head -n 1 || true)"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Live entry asset matches this build: $LIVE"
              break
            fi
            echo "Attempt ${attempt}/20: live=${LIVE:-<none>} expected=${EXPECTED}"
            if [ "$attempt" -eq 20 ]; then
              echo "::error::GitHub Pages still serves a stale build (expected ${EXPECTED}, got ${LIVE:-<none>})"
              exit 1
            fi
            sleep 30
          done

          for asset in favicon.svg apple-touch-icon.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$asset")
            echo "$BASE/$asset -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$asset did not return HTTP 200"; exit 1; }
          done

          for path in "" privacy/ privacy/fr/ privacy/en/ privacy/ar/ delete-account/ delete-account/fr/ delete-account/en/ delete-account/ar/; do
            url="${BASE}/${path}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::$url did not return HTTP 200"; exit 1; }
          done
