name: Production Release (Signed APK, AAB & Windows EXE) & Website Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      update_website:
        description: 'Update and deploy production website'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-and-deploy'
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 0: Quality gate (secret guard + typecheck + unit tests)
  # Every build job depends on this one: a red typecheck or a broken
  # protocol test must never reach an APK, an EXE or the website.
  # ============================================================
  quality:
    name: Quality Gate (typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard - no credentials tracked in git
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pem)$|(^|/)key\.properties$|(^|/)\.env($|\.)|service[-_]account.*\.json$'; then
            echo "::error::Sensitive file tracked in git. Remove it and rotate the secret."
            exit 1
          fi
          echo "No credential file is tracked."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (protocol layer)
        run: npm test

  # ============================================================
  # JOB 1: Build & Update Production Website (GitHub Pages / Web)
  # ============================================================
  build-and-update-website:
    name: Build & Update Production Website
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application (Vite Production SPA)
        run: npm run build
        env:
          # GitHub Pages serves this repo from /<repo>/, not from the domain root.
          # Without this the built index.html points at /assets/... and the page stays blank.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify Legal Pages in dist output (AGENTS.md 19.3)
        run: |
          for p in privacy delete-account; do
            for l in "" fr/ en/ ar/; do
              test -f "dist/$p/${l}index.html" || { echo "::error::Missing dist/$p/${l}index.html in production build"; exit 1; }
            done
          done
          echo " Legal pages verified in production build dist/."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Package & Upload Versioned Web Build
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          cd dist && zip -qr "../web-build-v$VERSION.zip" . && cd ..
          ls -l "web-build-v$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web-build-v*.zip
          retention-days: 30

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4

      # A 200 on the HTML is not proof: if VITE_BASE is wrong, index.html loads and the
      # bundle 404s, leaving a blank page. This check resolves every asset and fails loudly.
      - name: Smoke check live site (asset base + legal pages)
        run: |
          set -uo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}/"
          echo "Checking $BASE"

          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE")
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$BASE returned $code"; exit 1; }

          html=$(curl -fsSL "$BASE") || { echo "::error::cannot fetch $BASE"; exit 1; }

          if echo "$html" | grep -q '\(src\|href\)="/assets/'; then
            echo "::error::index.html still references /assets/ at the domain root - VITE_BASE was not applied"
            exit 1
          fi

          refs=$(echo "$html" | grep -oE '(src|href)="[^"]+\.(js|css)"' | sed -E 's/^(src|href)="//; s/"$//')
          if [ -z "$refs" ]; then echo "::error::no bundle referenced by index.html"; exit 1; fi

          for ref in $refs; do
            case "$ref" in
              http*) url="$ref" ;;
              /*)    url="https://$(echo "$BASE" | sed -E 's#https://([^/]+)/.*#\1#')$ref" ;;
              *)     url="$BASE$ref" ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] || { echo "::error::$url returned $code"; exit 1; }
            echo "OK $url"
          done

          for p in privacy/ delete-account/ privacy/fr/ privacy/ar/ delete-account/ar/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p")
            [ "$code" = "200" ] || { echo "::error::$BASE$p returned $code"; exit 1; }
          done
          echo "Live site verified."

  # ============================================================
  # JOB 2: Build & Package Signed Android Release (APK & AAB)
  # Package: com.planning.oran
  # ============================================================
  build-and-publish-android-release:
    name: Build & Sign Android (APK + AAB)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets (relative base for WebView)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Sync Capacitor assets to Android project
        run: npx cap sync android

      # Setup or generate Keystore with com.planning.oran credentials
      - name: Prepare Signing Keystore (com.planning.oran)
        id: keystore_prep
        run: |
          mkdir -p /tmp/keystore
          mkdir -p android/app/build/outputs/apk/release
          mkdir -p android/app/build/outputs/bundle/release

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Run scripts/bootstrap-secrets.sh (AGENTS.md ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â§Appendix B). Never hardcode keystores or passwords."
            exit 1
          fi
          echo " Using official ANDROID_KEYSTORE_BASE64 from GitHub Secrets."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore/release.keystore
          echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          chmod 600 /tmp/keystore/release.keystore

      # Build Signed APK & Signed AAB
      - name: Compile & Package Signed Android Release (APK & AAB)
        run: |
          echo "Packaging Production Android Binaries for Package ID: com.planning.oran..."
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            VERSION_NAME="$(node -p "require('./package.json').version")"
            cd android && ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=/tmp/keystore/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --no-daemon --parallel -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"; cd ..
          else
            echo "::error::gradlew not found - android/ Capacitor project missing."
            exit 1
          fi

      # AGENTS.md 16: signing is verified in CI, never assumed (no `|| true`).
      - name: Verify Cryptographic Android Signatures
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }

          echo "== Audit signature APK (apksigner) =="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          APK_SHA="$(grep -m1 'certificate SHA-256 digest' apk-cert.txt | awk '{print $NF}' | norm)"

          echo "== Audit signature AAB (jarsigner) =="
          jarsigner -verify -certs "$AAB" | tail -n 5

          if [[ -n "${{ vars.UPLOAD_CERT_SHA256 }}" ]]; then
            EXPECTED="$(echo "${{ vars.UPLOAD_CERT_SHA256 }}" | norm)"
            [[ "$APK_SHA" == "$EXPECTED" ]] || {
              echo "::error::APK signing certificate $APK_SHA does not match UPLOAD_CERT_SHA256 ($EXPECTED)"; exit 1; }
            echo "Signing certificate matches UPLOAD_CERT_SHA256."
          else
            echo "::warning::UPLOAD_CERT_SHA256 variable not set - fingerprint not enforced."
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -rf /tmp/keystore

      - name: Upload AAB to Google Play (internal track)
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK_RELEASE || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Note â€” Play upload skipped
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT != 'true' }}
        run: echo "PLAY_STORE_JSON_KEY not configured; skipping Play upload (set vars.PLAY_STORE_JSON_KEY_PRESENT=true after adding the secret)."

  # ============================================================
  # JOB 3: Build & Sign Windows Executable (.exe)
  # ============================================================
  build-and-publish-windows-release:
    name: Build & Sign Windows EXE (.exe)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if (Test-Path "package-lock.json") {
            npm ci --legacy-peer-deps
          } else {
            npm install --legacy-peer-deps
          }

      - name: Build Web Application (relative base for desktop WebView)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Package Windows Executable Desktop Application
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          $version = node -p "require('./package.json').version"
          Write-Host "Application version: $version"
          pwsh -File scripts/package-windows.ps1 -Version $version

      - name: Build Inno Setup Installer (EXE)
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$version" scripts\installer.iss

      - name: Sign Inno Setup Installer
        shell: pwsh
        run: |
          $exe = "dist-windows\Planning-Oran-Setup-Inno.exe"
          if ($env:WINDOWS_CERT_BASE64) {
            [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            Set-AuthenticodeSignature -FilePath $exe -Certificate (Get-PfxCertificate "$env:TEMP\cert.pfx") -HashAlgorithm SHA256 | Out-Null
            Remove-Item "$env:TEMP\cert.pfx" -Force
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Planning Oran Official, O=Planning Oran, C=DZ" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          }
          Get-AuthenticodeSignature $exe | Format-List
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-windows\Planning-Oran-Setup.exe
            dist-windows\Planning-Oran-Setup-v*.exe
            dist-windows\Planning-Oran-Windows-v*.zip
            dist-windows\Planning-Oran-Setup-Inno.exe
          retention-days: 30

  # ============================================================
  # JOB 4: Publish All Signed Artifacts to GitHub Release
  # ============================================================
  publish-github-release:
    name: Publish GitHub Release (APK, AAB, Windows EXE & Web)
    needs: [build-and-update-website, build-and-publish-android-release, build-and-publish-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: release-assets/web

      # AGENTS.md 18: released artifacts are ALWAYS versioned (Planning-Oran-vX.Y.Z.*)
      # and the tag must match package.json (single source of truth).
      - name: Prepare Final Release Package & Checksums
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Release version: $VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" == "v$VERSION" ]] || {
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"; exit 1; }
          fi

          mkdir -p release-final

          cp release-assets/android/apk/release/app-release.apk    "release-final/Planning-Oran-v$VERSION.apk"
          cp release-assets/android/bundle/release/app-release.aab "release-final/Planning-Oran-v$VERSION.aab"
          cp release-assets/android/mapping/release/mapping.txt    "release-final/mapping-v$VERSION.txt" \
            || echo "::warning::R8 mapping.txt not found (is minify enabled?)"

          cp release-assets/windows/Planning-Oran-Setup.exe        "release-final/Planning-Oran-Setup-v$VERSION.exe"
          cp release-assets/windows/Planning-Oran-Windows-v*.zip   release-final/
          cp release-assets/windows/Planning-Oran-Setup-Inno.exe   "release-final/Planning-Oran-Setup-Inno-v$VERSION.exe"

          cp release-assets/web/web-build-v*.zip                   release-final/

          cd release-final
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a version tag push - release notes not required."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]] || { echo "::error::CHANGELOG.md has no section for version $VERSION"; exit 1; }
          cat release-notes.md

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-final/*.apk
            release-final/*.aab
            release-final/*-v*.exe
            release-final/*-v*.zip
            release-final/mapping-v*.txt
            release-final/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
