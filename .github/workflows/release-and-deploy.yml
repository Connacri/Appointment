name: Production Release (Signed APK, AAB & Native Windows Rust EXE)

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - "src/**"
      - "android/**"
      - "windows-native/**"
      - "supabase/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "CHANGELOG.md"
      - ".github/workflows/release-and-deploy.yml"
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: 'release-and-deploy'
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  # ============================================================
  # JOB 2: Build & Package Signed Android Release (APK & AAB)
  # Package: com.planning.oran
  # ============================================================
  build-and-publish-android-release:
    name: Build & Sign Android (APK + AAB)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        uses: ./.github/actions/npm-install

      - name: Build Web Production Assets (relative base for WebView)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Sync Capacitor assets to Android project
        run: npx cap sync android

      # Setup or generate Keystore with com.planning.oran credentials
      - name: Prepare Signing Keystore (com.planning.oran)
        id: keystore_prep
        run: |
          mkdir -p /tmp/keystore
          mkdir -p android/app/build/outputs/apk/release
          mkdir -p android/app/build/outputs/bundle/release

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Run scripts/bootstrap-secrets.sh (AGENTS.md ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â§Appendix B). Never hardcode keystores or passwords."
            exit 1
          fi
          echo " Using official ANDROID_KEYSTORE_BASE64 from GitHub Secrets."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore/release.keystore
          echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          chmod 600 /tmp/keystore/release.keystore

      # Build Signed APK & Signed AAB
      - name: Compile & Package Signed Android Release (APK & AAB)
        run: |
          echo "Packaging Production Android Binaries for Package ID: com.planning.oran..."
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            VERSION_NAME="$(node -p "require('./package.json').version")"
            cd android && ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=/tmp/keystore/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --no-daemon --max-workers=2 --stacktrace -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"; cd ..
          else
            echo "::error::gradlew not found - android/ Capacitor project missing."
            exit 1
          fi

      # AGENTS.md 16: signing is verified in CI, never assumed (no `|| true`).
      - name: Verify Cryptographic Android Signatures
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }

          echo "== Audit signature APK (apksigner) =="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          APK_SHA="$(grep -m1 'certificate SHA-256 digest' apk-cert.txt | awk '{print $NF}' | norm)"

          echo "== Audit signature AAB (jarsigner) =="
          AAB_VERIFY="$(jarsigner -verify -certs "$AAB" 2>&1)"
          printf '%s\n' "$AAB_VERIFY" | tail -n 8
          grep -qi 'jar verified\.' <<< "$AAB_VERIFY" || {
            echo "::error::AAB signature verification did not report a verified JAR"; exit 1; }

          AAB_SHA="$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2; exit}' | norm)"
          test -n "$AAB_SHA" || { echo "::error::Unable to read AAB signer SHA-256"; exit 1; }
          [[ "$AAB_SHA" == "$APK_SHA" ]] || {
            echo "::error::AAB signer $AAB_SHA does not match APK signer $APK_SHA"; exit 1; }
          echo "APK and AAB use the same signing certificate."

          if [[ -z "${{ vars.UPLOAD_CERT_SHA256 }}" ]]; then
            echo "::error::UPLOAD_CERT_SHA256 repository variable is required for production signing verification."
            exit 1
          fi
          EXPECTED="$(echo "${{ vars.UPLOAD_CERT_SHA256 }}" | norm)"
          [[ -n "$EXPECTED" ]] || { echo "::error::UPLOAD_CERT_SHA256 is empty"; exit 1; }
          [[ "$APK_SHA" == "$EXPECTED" ]] || {
            echo "::error::APK signing certificate $APK_SHA does not match UPLOAD_CERT_SHA256 ($EXPECTED)"; exit 1; }
          echo "Signing certificate matches UPLOAD_CERT_SHA256."


      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -rf /tmp/keystore

      - name: Upload AAB to Google Play (internal track)
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.release_track || vars.PLAY_TRACK_RELEASE || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Note â€” Play upload skipped
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT != 'true' }}
        run: echo "PLAY_STORE_JSON_KEY not configured; skipping Play upload (set vars.PLAY_STORE_JSON_KEY_PRESENT=true after adding the secret)."

  # ============================================================
  # JOB 3: Build the independent Rust/Win32 Windows application
  # ============================================================
  build-and-publish-windows-release:
    name: Build & Sign Native Windows Rust EXE
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-native -> target

      - name: Verify application and native crate versions
        shell: pwsh
        run: |
          $appVersion = node -p "require('./package.json').version"
          $cargoText = Get-Content -Raw "windows-native\Cargo.toml"
          if ($cargoText -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Cargo package version is missing."
          }
          $nativeVersion = $Matches[1]
          if ($nativeVersion -ne $appVersion) {
            throw "Version mismatch: package.json=$appVersion, windows-native/Cargo.toml=$nativeVersion"
          }
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          Write-Host "Release version: $appVersion"

      - name: Verify Rust formatting
        working-directory: windows-native
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        working-directory: windows-native
        run: cargo test --locked

      - name: Run Clippy
        working-directory: windows-native
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build independent native Windows x64 executable
        working-directory: windows-native
        run: cargo build --release --locked

      - name: Verify native binary
        shell: pwsh
        run: |
          $nativeExe = "windows-native\target\release\appointment-pms-native.exe"
          if (-not (Test-Path -LiteralPath $nativeExe -PathType Leaf)) {
            throw "Rust native Windows executable was not produced: $nativeExe"
          }
          $size = (Get-Item -LiteralPath $nativeExe).Length
          if ($size -lt 100KB) { throw "Native executable is unexpectedly small ($size bytes)." }
          Write-Host "Native executable: $nativeExe ($size bytes)"

      - name: Verify browser and runtime independence
        shell: pwsh
        run: |
          $exe = "windows-native\\target\\release\\appointment-pms-native.exe"
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\\Installer\\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found; cannot inspect native imports" }
          $vsPath = & $vswhere -latest -products "*" -property installationPath
          if (!$vsPath) { throw "Visual Studio installation not found; cannot inspect native imports" }
          $devcmd = Join-Path $vsPath "Common7\\Tools\\VsDevCmd.bat"
          $command = 'call "' + $devcmd + '" -arch=amd64 && dumpbin /dependents "' + $exe + '"'
          $imports = cmd.exe /d /c $command 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin import inspection failed: $imports" }
          if ($imports -match "WebView2|msedge|chrome|node") {
            throw "Browser/WebView/Node dependency detected in native executable"
          }
          if ($imports -match "VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt") {
            throw "Dynamic Microsoft C/C++ runtime detected; installer must be self-contained"
          }
          Write-Host $imports

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "/DAppVersion=$env:APP_VERSION" "windows-native\installer\Appointment.iss"
          if ($LASTEXITCODE -ne 0) { throw "Native Inno Setup build failed: $LASTEXITCODE" }

      - name: Sign and verify native Windows release binaries
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $nativeExe = "windows-native\target\release\appointment-pms-native.exe"
          $nativeInstaller = "windows-native\dist\Appointment-PMS-Setup-v$env:APP_VERSION.exe"
          pwsh -File "scripts\sign-windows-artifacts.ps1" -Paths @($nativeExe, $nativeInstaller)

      - name: Package native Windows distribution ZIP
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $stage = Join-Path $env:RUNNER_TEMP "appointment-native-release"
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "windows-native\target\release\appointment-pms-native.exe" $stage
          Copy-Item "windows-native\dist\Appointment-PMS-Setup-v$version.exe" $stage
          @(
            "Appointment PMS — Native Windows x64",
            "Independent Rust/Win32 executable. No WebView2, Edge, Chrome, Electron or Node runtime.",
            "Install with Appointment-PMS-Setup-v$version.exe or run appointment-pms-native.exe.",
            "Release version: $version",
            "Source commit: ${{ github.sha }}"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "README.txt")
          $archive = "windows-native\dist\Appointment-PMS-Windows-Native-v$version.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Native Windows distribution ZIP was not produced."
          }

      - name: Upload native Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows-native/target/release/appointment-pms-native.exe
            windows-native/dist/Appointment-PMS-Setup-v*.exe
            windows-native/dist/Appointment-PMS-Windows-Native-v*.zip
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # JOB 4: Publish All Signed Artifacts to GitHub Release
  # ============================================================
  publish-github-release:
    name: Publish GitHub Release (APK, AAB & Native Windows EXE)
    needs: [quality-gate, build-and-publish-android-release, build-and-publish-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      # AGENTS.md 18: released artifacts are ALWAYS versioned (Appointment-PMS-vX.Y.Z.*)
      # and the tag must match package.json (single source of truth).
      - name: Prepare Final Release Package & Checksums
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Release version: $VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" == "v$VERSION" ]] || {
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"; exit 1; }
          fi

          mkdir -p release-final
          # Robust artifact discovery (handles any upload-artifact@v4 directory nesting)
          APK_FILE=$(find release-assets/android -type f -name "app-release.apk" 2>/dev/null | head -n 1)
          AAB_FILE=$(find release-assets/android -type f -name "app-release.aab" 2>/dev/null | head -n 1)
          MAP_FILE=$(find release-assets/android -type f -name "mapping.txt" 2>/dev/null | head -n 1)

          test -n "$APK_FILE" || { echo "::error::Required APK artifact is missing"; exit 1; }
          test -n "$AAB_FILE" || { echo "::error::Required AAB artifact is missing"; exit 1; }

          cp "$APK_FILE" "release-final/Appointment-PMS-v$VERSION.apk"
          cp "$AAB_FILE" "release-final/Appointment-PMS-v$VERSION.aab"

          if [[ -n "$MAP_FILE" ]]; then
            cp "$MAP_FILE" "release-final/mapping-v$VERSION.txt"
          fi

          NATIVE_EXE=$(find release-assets/windows -type f -name "appointment-pms-native.exe" 2>/dev/null | head -n 1)
          NATIVE_INSTALLER=$(find release-assets/windows -type f -name "Appointment-PMS-Setup-v*.exe" 2>/dev/null | head -n 1)
          NATIVE_ZIP=$(find release-assets/windows -type f -name "Appointment-PMS-Windows-Native-v*.zip" 2>/dev/null | head -n 1)

          test -n "$NATIVE_EXE" || { echo "::error::Rust/Win32 native Windows executable is missing"; exit 1; }
          test -n "$NATIVE_INSTALLER" || { echo "::error::Native Inno Setup installer is missing"; exit 1; }
          test -n "$NATIVE_ZIP" || { echo "::error::Native Windows distribution ZIP is missing"; exit 1; }

          cp "$NATIVE_EXE" "release-final/Appointment-PMS-Native-v$VERSION.exe"
          cp "$NATIVE_INSTALLER" "release-final/Appointment-PMS-Setup-Native-v$VERSION.exe"
          cp "$NATIVE_ZIP" "release-final/Appointment-PMS-Windows-Native-v$VERSION.zip"

          cd release-final
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract or generate release notes
        id: release_notes
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release notes for version $VERSION..."
          if awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md 2>/dev/null && [[ -s release-notes.md ]]; then
            echo "Release notes extracted from CHANGELOG.md"
          else
            echo "## Release v$VERSION (Build #${{ github.run_number }})" > release-notes.md
            echo "" >> release-notes.md
            echo "Automated continuous delivery release generated on push to \`${{ github.ref_name }}\`." >> release-notes.md
            echo "- Commit: \`${{ github.sha }}\`" >> release-notes.md
            echo "- Signed Android APK: \`Appointment-PMS-v$VERSION.apk\`" >> release-notes.md
            echo "- Signed Android AAB: \`Appointment-PMS-v$VERSION.aab\`" >> release-notes.md
            echo "- Native Windows Rust EXE: \`Appointment-PMS-Native-v$VERSION.exe\`" >> release-notes.md
            echo "- Native Windows Installer: \`Appointment-PMS-Setup-Native-v$VERSION.exe\`" >> release-notes.md
            echo "- Native Windows Distribution: \`Appointment-PMS-Windows-Native-v$VERSION.zip\`" >> release-notes.md
          fi
          cat release-notes.md

      - name: Publish Versioned GitHub Release (APK, AAB & Native Windows EXE)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Appointment PMS Release v${{ steps.release_notes.outputs.version }} (Build #${{ github.run_number }})"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', steps.release_notes.outputs.version, github.run_number) }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            release-final/*.apk
            release-final/*.aab
            release-final/*.exe
            release-final/*.zip
            release-final/mapping-v*.txt
            release-final/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
