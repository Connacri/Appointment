name: Production Release (Signed APK/AAB) & Website Update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      update_website:
        description: 'Update and deploy production website'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-and-deploy'
  cancel-in-progress: false

jobs:
  build-and-publish-android-release:
    name: Build & Publish Signed APK / AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js 22 for Assets & Capacitor/Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Decode Android Production Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore

      # Build Signed APK
      - name: Build Signed Production APK (assembleRelease)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon --parallel

      # Build Signed AAB
      - name: Build Signed Production AAB (bundleRelease)
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon --parallel

      # Verify Cryptographic Signatures
      - name: Verify APK & AAB Signature with apksigner
        run: |
          echo "== Verifying APK =="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs build/outputs/apk/release/app-release.apk
          echo "== Verifying AAB =="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs build/outputs/bundle/release/app-release.aab

      # Publish GitHub Release with Signed APK & Signed AAB attached
      - name: Publish GitHub Release (Signed APK & AAB)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Release ${{ github.ref_name || 'Manual Build' }}
          tag_name: ${{ github.ref_name || 'v1.0.0-build' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/outputs/apk/release/app-release.apk
            build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload AAB to Google Play Store
      - name: Upload Signed AAB to Google Play Console
        if: env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ vars.APPLICATION_ID || 'com.omnibook.app' }}
          releaseFiles: build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.release_track || vars.RELEASE_TRACK || 'internal' }}
          userFraction: 0.10
        env:
          HAS_PLAY_SECRET: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}

      - name: Cleanup Keystore from Runner
        if: always()
        run: rm -f /tmp/release.keystore

  build-and-update-website:
    name: Build & Update Production Website
    runs-on: ubuntu-latest
    needs: [build-and-publish-android-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Configure GitHub Pages / Production Hosting
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4
