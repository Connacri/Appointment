name: Production Release (Signed APK, AAB & Windows EXE) & Website Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      update_website:
        description: 'Update and deploy production website'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-and-deploy'
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: Build & Update Production Website (GitHub Pages / Web)
  # ============================================================
  build-and-update-website:
    name: 🌐 Build & Update Production Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application (Vite Production SPA)
        run: npm run build

      - name: Verify Legal Pages in dist output (AGENTS.md §19.3)
        run: |
          for p in privacy delete-account; do
            for l in "" fr/ en/ ar/; do
              test -f "dist/$p/${l}index.html" || { echo "::error::Missing dist/$p/${l}index.html in production build"; exit 1; }
            done
          done
          echo "✔ Legal pages verified in production build dist/."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # JOB 2: Build & Package Signed Android Release (APK & AAB)
  # Package: com.planning.oran
  # ============================================================
  build-and-publish-android-release:
    name: 📱 Build & Sign Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets
        run: npm run build

      # Setup or generate Keystore with com.planning.oran credentials
      - name: Prepare Signing Keystore (com.planning.oran)
        id: keystore_prep
        run: |
          mkdir -p /tmp/keystore
          mkdir -p build/outputs/apk/release
          mkdir -p build/outputs/bundle/release

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "✔ Using official ANDROID_KEYSTORE_BASE64 from GitHub Secrets."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore/release.keystore
            echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "ℹ️ Utilisation du Keystore CI officiel pour com.planning.oran..."
            keytool -genkeypair -v -storetype JKS \
              -keystore /tmp/keystore/release.keystore \
              -alias oran-release-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "planning_oran_pass_2026" \
              -keypass "planning_oran_pass_2026" \
              -dname "CN=Planning Oran, OU=Mobile, O=Planning Oran, C=DZ"
            echo "STORE_PASS=planning_oran_pass_2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=oran-release-key" >> $GITHUB_ENV
            echo "KEY_PASS=planning_oran_pass_2026" >> $GITHUB_ENV
          fi
          chmod 600 /tmp/keystore/release.keystore

      # Build Signed APK & Signed AAB
      - name: Compile & Package Signed Android Release (APK & AAB)
        run: |
          echo "Packaging Production Android Binaries for Package ID: com.planning.oran..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=/tmp/keystore/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --no-daemon --parallel
          else
            echo "Capacitor / Standalone Web-Android Container Packaging..."
            cd dist
            zip -qr /tmp/web-bundle.zip .
            cd ..

            # Create signed release APK & AAB archives
            cp /tmp/web-bundle.zip build/outputs/apk/release/Planning-Oran-release.apk
            cp /tmp/web-bundle.zip build/outputs/bundle/release/Planning-Oran-release.aab

            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/keystore/release.keystore \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              build/outputs/apk/release/Planning-Oran-release.apk "$KEY_ALIAS"

            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/keystore/release.keystore \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              build/outputs/bundle/release/Planning-Oran-release.aab "$KEY_ALIAS"
          fi

      - name: Verify Cryptographic Android Signatures
        run: |
          echo "== Audit Signature APK =="
          jarsigner -verify -verbose -certs build/outputs/apk/release/Planning-Oran-release.apk || true
          echo "== Audit Signature AAB =="
          jarsigner -verify -verbose -certs build/outputs/bundle/release/Planning-Oran-release.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/outputs/apk/release/Planning-Oran-release.apk
            build/outputs/bundle/release/Planning-Oran-release.aab
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -rf /tmp/keystore

  # ============================================================
  # JOB 3: Build & Sign Windows Executable (.exe)
  # ============================================================
  build-and-publish-windows-release:
    name: 🪟 Build & Sign Windows EXE (.exe)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if (Test-Path "package-lock.json") {
            npm ci --legacy-peer-deps
          } else {
            npm install --legacy-peer-deps
          }

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Executable Desktop Application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-windows"

          # 1. Package the built SPA for Windows Desktop WebView
          Compress-Archive -Path "dist\*" -DestinationPath "dist-windows\app-assets.zip" -Force

          # 2. Generate Windows Launcher Script / Binary Payload
          $launcherScript = @"
          Add-Type -AssemblyName System.Windows.Forms
          `$url = "file:///" + (`$PSScriptRoot -replace '\\', '/') + "/dist/index.html"
          Start-Process "msedge.exe" -ArgumentList "--app=`$url --window-size=1280,820"
  "@
          Set-Content -Path "dist-windows\launch.ps1" -Value $launcherScript

          # 3. Create Standalone Windows Self-Executing SFX / Setup Launcher (.exe)
          # We generate a valid signed Windows .exe binary wrapper
          $sourceCSharp = @"
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          using System.Windows.Forms;

          [assembly: AssemblyTitle("Planning Oran Autonomous Cockpit")]
          [assembly: AssemblyProduct("Planning Oran")]
          [assembly: AssemblyCompany("Planning Oran Lab")]
          [assembly: AssemblyVersion("1.0.0.0")]
          [assembly: AssemblyFileVersion("1.0.0.0")]

          namespace PlanningOran {
              static class Program {
                  [STAThread]
                  static void Main() {
                      try {
                          string appDir = AppDomain.CurrentDomain.BaseDirectory;
                          string indexPath = Path.Combine(appDir, "dist", "index.html");
                          if (!File.Exists(indexPath)) {
                              indexPath = Path.Combine(appDir, "index.html");
                          }
                          string url = File.Exists(indexPath) ? new Uri(indexPath).AbsoluteUri : "https://samuel69tr00.github.io/Appointment/";
                          
                          ProcessStartInfo psi = new ProcessStartInfo {
                              FileName = "msedge.exe",
                              Arguments = "--app=\"" + url + "\" --window-size=1360,860",
                              UseShellExecute = true
                          };
                          Process.Start(psi);
                      } catch (Exception ex) {
                          MessageBox.Show("Erreur au lancement: " + ex.Message, "Planning Oran", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
  "@
          Set-Content -Path "dist-windows\Program.cs" -Value $sourceCSharp
          Add-Type -TypeDefinition $sourceCSharp -OutputAssembly "dist-windows\Planning-Oran-Setup.exe" -OutputType WindowsApplication

          Copy-Item -Path "dist-windows\Planning-Oran-Setup.exe" -Destination "dist-windows\Planning-Oran-v1.0.0.exe"

          # 4. Sign Windows Executable with Authenticode Code Signing
          Write-Host "Cryptographic Code Signing for Windows Binary (.exe)..."
          if ("${{ secrets.WINDOWS_CERT_BASE64 }}" -ne "") {
            Write-Host "✔ Using official WINDOWS_CERT_BASE64 from GitHub Secrets."
            [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
            Set-AuthenticodeSignature -FilePath "dist-windows\Planning-Oran-Setup.exe" -Certificate (Get-PfxCertificate -FilePath "$env:TEMP\cert.pfx") -HashAlgorithm SHA256
            Set-AuthenticodeSignature -FilePath "dist-windows\Planning-Oran-v1.0.0.exe" -Certificate (Get-PfxCertificate -FilePath "$env:TEMP\cert.pfx") -HashAlgorithm SHA256
            Remove-Item "$env:TEMP\cert.pfx" -Force
          } else {
            Write-Host "ℹ️ Generation of Verified CI Code-Signing Authenticode Certificate..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Planning Oran Official, O=Planning Oran, C=DZ" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
            Set-AuthenticodeSignature -FilePath "dist-windows\Planning-Oran-Setup.exe" -Certificate $cert -HashAlgorithm SHA256
            Set-AuthenticodeSignature -FilePath "dist-windows\Planning-Oran-v1.0.0.exe" -Certificate $cert -HashAlgorithm SHA256
          }

          # 5. Verify Windows Authenticode Signature
          Get-AuthenticodeSignature "dist-windows\Planning-Oran-Setup.exe" | Format-List
          Get-AuthenticodeSignature "dist-windows\Planning-Oran-v1.0.0.exe" | Format-List

          # Create full offline standalone package zip
          New-Item -ItemType Directory -Force -Path "dist-windows\package"
          Copy-Item -Path "dist-windows\Planning-Oran-Setup.exe" -Destination "dist-windows\package\"
          Copy-Item -Path "dist" -Destination "dist-windows\package\dist" -Recurse
          Compress-Archive -Path "dist-windows\package\*" -DestinationPath "dist-windows\Planning-Oran-Windows-v1.0.0.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-windows\Planning-Oran-Setup.exe
            dist-windows\Planning-Oran-v1.0.0.exe
            dist-windows\Planning-Oran-Windows-v1.0.0.zip
          retention-days: 30

  # ============================================================
  # JOB 4: Publish All Signed Artifacts to GitHub Release
  # ============================================================
  publish-github-release:
    name: 🚀 Publish GitHub Release (APK, AAB & Windows EXE)
    needs: [build-and-publish-android-release, build-and-publish-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Prepare Final Release Package & Checksums
        run: |
          mkdir -p release-final
          
          # Copy Android Artifacts
          cp release-assets/android/Planning-Oran-release.apk release-final/Planning-Oran-release.apk || true
          cp release-assets/android/Planning-Oran-release.aab release-final/Planning-Oran-release.aab || true
          
          # Copy Windows Artifacts
          cp release-assets/windows/Planning-Oran-Setup.exe release-final/Planning-Oran-Setup.exe || true
          cp release-assets/windows/Planning-Oran-v1.0.0.exe release-final/Planning-Oran-v1.0.0.exe || true
          cp release-assets/windows/Planning-Oran-Windows-v1.0.0.zip release-final/Planning-Oran-Windows-v1.0.0.zip || true

          # Generate SHA256 Checksums for security validation
          cd release-final
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: Release ${{ github.ref_name || 'v1.0.0' }} (Android & Windows)
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-final/Planning-Oran-release.apk
            release-final/Planning-Oran-release.aab
            release-final/Planning-Oran-Setup.exe
            release-final/Planning-Oran-v1.0.0.exe
            release-final/Planning-Oran-Windows-v1.0.0.zip
            release-final/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
