name: Production Release (Signed APK, AAB & Windows EXE)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: 'release-and-deploy'
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  # ============================================================
  # JOB 2: Build & Package Signed Android Release (APK & AAB)
  # Package: com.planning.oran
  # ============================================================
  build-and-publish-android-release:
    name: Build & Sign Android (APK + AAB)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        uses: ./.github/actions/npm-install

      - name: Build Web Production Assets (relative base for WebView)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Sync Capacitor assets to Android project
        run: npx cap sync android

      # Setup or generate Keystore with com.planning.oran credentials
      - name: Prepare Signing Keystore (com.planning.oran)
        id: keystore_prep
        run: |
          mkdir -p /tmp/keystore
          mkdir -p android/app/build/outputs/apk/release
          mkdir -p android/app/build/outputs/bundle/release

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Run scripts/bootstrap-secrets.sh (AGENTS.md ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â§Appendix B). Never hardcode keystores or passwords."
            exit 1
          fi
          echo " Using official ANDROID_KEYSTORE_BASE64 from GitHub Secrets."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore/release.keystore
          echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          chmod 600 /tmp/keystore/release.keystore

      # Build Signed APK & Signed AAB
      - name: Compile & Package Signed Android Release (APK & AAB)
        run: |
          echo "Packaging Production Android Binaries for Package ID: com.planning.oran..."
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            VERSION_NAME="$(node -p "require('./package.json').version")"
            cd android && ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=/tmp/keystore/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --no-daemon --max-workers=2 --stacktrace -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"; cd ..
          else
            echo "::error::gradlew not found - android/ Capacitor project missing."
            exit 1
          fi

      # AGENTS.md 16: signing is verified in CI, never assumed (no `|| true`).
      - name: Verify Cryptographic Android Signatures
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }

          echo "== Audit signature APK (apksigner) =="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          APK_SHA="$(grep -m1 'certificate SHA-256 digest' apk-cert.txt | awk '{print $NF}' | norm)"

          echo "== Audit signature AAB (jarsigner) =="
          jarsigner -verify -certs "$AAB" | tail -n 5

          if [[ -z "${{ vars.UPLOAD_CERT_SHA256 }}" ]]; then
            echo "::error::UPLOAD_CERT_SHA256 repository variable is required for production signing verification."
            exit 1
          fi
          EXPECTED="$(echo "${{ vars.UPLOAD_CERT_SHA256 }}" | norm)"
          [[ -n "$EXPECTED" ]] || { echo "::error::UPLOAD_CERT_SHA256 is empty"; exit 1; }
          [[ "$APK_SHA" == "$EXPECTED" ]] || {
            echo "::error::APK signing certificate $APK_SHA does not match UPLOAD_CERT_SHA256 ($EXPECTED)"; exit 1; }
          echo "Signing certificate matches UPLOAD_CERT_SHA256."


      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -rf /tmp/keystore

      - name: Upload AAB to Google Play (internal track)
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.release_track || vars.PLAY_TRACK_RELEASE || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Note â€” Play upload skipped
        if: ${{ vars.PLAY_STORE_JSON_KEY_PRESENT != 'true' }}
        run: echo "PLAY_STORE_JSON_KEY not configured; skipping Play upload (set vars.PLAY_STORE_JSON_KEY_PRESENT=true after adding the secret)."

  # ============================================================
  # JOB 3: Build & Sign Windows Executable (.exe)
  # ============================================================
  build-and-publish-windows-release:
    name: Build & Sign Windows EXE (.exe)
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Build Web Application (relative base for desktop WebView)
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Package Windows Executable Desktop Application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Write-Host "Application version: $version"
          pwsh -File scripts/package-windows.ps1 -Version $version

      - name: Build Inno Setup Installer (EXE)
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$version" scripts\installer.iss

      - name: Sign and verify all Windows executables
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = node -p "require('./package.json').version"
          $paths = @(
            "dist-windows\Appointment-PMS-Setup.exe",
            "dist-windows\Appointment-PMS-Setup-v$version.exe",
            "dist-windows\Appointment-PMS-Setup-Inno.exe"
          )
          pwsh -File scripts/sign-windows-artifacts.ps1 -Paths $paths

      - name: Package signed Windows distribution archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          pwsh -File scripts/package-windows-archive.ps1 -Version $version

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-windows\Appointment-PMS-Setup.exe
            dist-windows\Appointment-PMS-Setup-v*.exe
            dist-windows\Appointment-PMS-Windows-v*.zip
            dist-windows\Appointment-PMS-Setup-Inno.exe
          retention-days: 30

  # ============================================================
  # JOB 4: Publish All Signed Artifacts to GitHub Release
  # ============================================================
  publish-github-release:
    name: Publish GitHub Release (APK, AAB & Windows EXE)
    needs: [quality-gate, build-and-publish-android-release, build-and-publish-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      # AGENTS.md 18: released artifacts are ALWAYS versioned (Appointment-PMS-vX.Y.Z.*)
      # and the tag must match package.json (single source of truth).
      - name: Prepare Final Release Package & Checksums
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Release version: $VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" == "v$VERSION" ]] || {
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"; exit 1; }
          fi

          mkdir -p release-final
          # Robust artifact discovery (handles any upload-artifact@v4 directory nesting)
          APK_FILE=$(find release-assets/android -type f -name "app-release.apk" 2>/dev/null | head -n 1)
          AAB_FILE=$(find release-assets/android -type f -name "app-release.aab" 2>/dev/null | head -n 1)
          MAP_FILE=$(find release-assets/android -type f -name "mapping.txt" 2>/dev/null | head -n 1)

          test -n "$APK_FILE" || { echo "::error::Required APK artifact is missing"; exit 1; }
          test -n "$AAB_FILE" || { echo "::error::Required AAB artifact is missing"; exit 1; }

          cp "$APK_FILE" "release-final/Appointment-PMS-v$VERSION.apk"
          cp "$AAB_FILE" "release-final/Appointment-PMS-v$VERSION.aab"

          if [[ -n "$MAP_FILE" ]]; then
            cp "$MAP_FILE" "release-final/mapping-v$VERSION.txt"
          fi

          WIN_SETUP=$(find release-assets/windows -type f \( -name "Appointment-PMS-Setup.exe" -o -name "Appointment-PMS-Setup-v*.exe" \) 2>/dev/null | head -n 1)
          WIN_INNO=$(find release-assets/windows -type f \( -name "Appointment-PMS-Setup-Inno.exe" -o -name "Appointment-PMS-Setup-Inno-v*.exe" \) 2>/dev/null | head -n 1)

          test -n "$WIN_SETUP" || { echo "::error::Required signed Windows launcher is missing"; exit 1; }
          test -n "$WIN_INNO" || { echo "::error::Required signed Inno Setup installer is missing"; exit 1; }

          cp "$WIN_SETUP" "release-final/Appointment-PMS-Setup-v$VERSION.exe"
          cp "$WIN_INNO" "release-final/Appointment-PMS-Setup-Inno-v$VERSION.exe"

          WIN_ZIP=$(find release-assets/windows -type f -name "Appointment-PMS-Windows-v*.zip" 2>/dev/null | head -n 1)
          test -n "$WIN_ZIP" || { echo "::error::Required Windows distribution ZIP is missing"; exit 1; }
          cp "$WIN_ZIP" release-final/

          cd release-final
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract or generate release notes
        id: release_notes
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release notes for version $VERSION..."
          if awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md 2>/dev/null && [[ -s release-notes.md ]]; then
            echo "Release notes extracted from CHANGELOG.md"
          else
            echo "## Release v$VERSION (Build #${{ github.run_number }})" > release-notes.md
            echo "" >> release-notes.md
            echo "Automated continuous delivery release generated on push to \`${{ github.ref_name }}\`." >> release-notes.md
            echo "- Commit: \`${{ github.sha }}\`" >> release-notes.md
            echo "- Signed Android APK: \`Appointment-PMS-v$VERSION.apk\`" >> release-notes.md
            echo "- Signed Android AAB: \`Appointment-PMS-v$VERSION.aab\`" >> release-notes.md
            echo "- Windows EXE Installer: \`Appointment-PMS-Setup-v$VERSION.exe\`" >> release-notes.md
          fi
          cat release-notes.md

      - name: Publish Versioned GitHub Release (APK, AAB & Windows EXE)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Appointment PMS Release v${{ steps.release_notes.outputs.version }} (Build #${{ github.run_number }})"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', steps.release_notes.outputs.version, github.run_number) }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            release-final/*.apk
            release-final/*.aab
            release-final/*.exe
            release-final/*.zip
            release-final/mapping-v*.txt
            release-final/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
