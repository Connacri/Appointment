name: Apply Rust formatting

on:
  push:
    branches: ["feat/native-supabase-auth"]
    paths:
      - "windows-native/src/**"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.ref == 'refs/heads/feat/native-supabase-auth'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-supabase-auth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and push
        shell: pwsh
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if (git diff --cached --quiet) {
            Write-Host "Rust sources already formatted."
            exit 0
          }
          git commit -m "style(native): apply rustfmt to Supabase auth"
          git push origin HEAD:feat/native-supabase-auth
