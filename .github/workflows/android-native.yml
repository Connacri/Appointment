name: Android Native (Capacitor)

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "src/App.tsx"
      - "src/components/LanDiscoveryStatus.tsx"
      - "src/services/p2p/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/App.tsx"
      - "src/services/p2p/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Compile Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        uses: ./.github/actions/npm-install

      - name: TypeScript and production web build
        run: |
          npm run typecheck
          npm run build
        env:
          VITE_BASE: ./

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Compile native Android APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: appointment-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
