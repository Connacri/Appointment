[package]
name = "appointment-pms-native"
version = "1.2.20"
edition = "2021"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
